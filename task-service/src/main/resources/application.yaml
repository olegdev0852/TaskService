spring:
    application:
        name: TaskService
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
        password: root
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
    data:
      web:
        pageable:
            default-page-size: 10
            max-page-size: 100
    liquibase:
      change-log: classpath:/db/changelog/changelog-master.yaml
      enabled: true

server:
    error:
        include-message: always

tasks:
        scheduled:
            cleanup-tasks-cron: "0 0 10 * * ?"
            cleanup-tasks-days-threshold: 30