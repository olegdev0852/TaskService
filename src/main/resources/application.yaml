spring:
    application:
        name: TaskService
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
        password: root
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true

server:
    error:
        include-message: always

tasks:
        scheduled:
            cleanup-tasks-cron: "0 0 10 * * ?"
            cleanup-tasks-days-threshold: 30